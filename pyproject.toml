[project]
name = "merino-workspace"
version = "0.1.0"
description = "Workspace for Merino services and shared packages"
requires-python = "~=3.14.0"
dependencies = [
  "merino",
  "merino-common",
  "merino-fleece",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
merino = { workspace = true }
merino-common = { workspace = true }
merino-fleece = { workspace = true }

[tool.uv.workspace]
members = [
  "apps/merino",
  "apps/fleece",
  "packages/merino-common",
  "tools/load-tests",
]

[dependency-groups]
dev = [
  "mypy==1.20.1",
  "pre-commit>=2.20.0,<3",
  "bandit[toml]>=1.9.0,<2",
  "types-PyYAML>=6.0.11,<7",
  "types-requests>=2.28.10,<3",
  "types-geoip2>=3.0.0,<4",
  "scalene>=1.5.13,<2",
  "pytest>=9.0.0,<10",
  "pytest-asyncio>=1.3.0,<2",
  "pytest-cov>=7.1.0,<8",
  "pytest-mock>=3.15.0,<4",
  "freezegun>=1.2.2,<2",
  "time-machine>=2.16.0,<3",
  "requests-mock>=1.10.0,<2",
  "requests-toolbelt>=1.0.0,<2",
  "ruff>=0.15.0,<1",
  "types-redis>=4.5.1.1,<5",
  "testcontainers>=4.0.1,<5",
  "types-pillow>=10.2.0.20240520,<11",
  "coverage>=7.13.5,<8",
  "opentelemetry-distro>=0.63b1",
  "opentelemetry-instrumentation-fastapi>=0.63b1",
  "opentelemetry-instrumentation-redis>=0.63b1",
  "opentelemetry-instrumentation-httpx>=0.63b1",
  "diff-cover>=10.3.0",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.coverage.run]
source = ["apps/merino/merino", "packages/merino-common/merino_common"]
branch = true
relative_files = true
omit = [
  "apps/merino/merino/jobs/utils/domain_tester.py",
  "apps/merino/merino/jobs/utils/system_monitor.py",
  "apps/merino/merino/utils/domain_categories/domain_category_mapping.py",
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 99
exclude = ["build", "dist", "__pycache__", ".git"]
lint.select = ["D", "E4", "E7", "E9", "F"]
# Error Code Ref: https://www.pydocstyle.org/en/stable/error_codes.html
# D212 Multi-line docstring summary should start at the first line
lint.extend-select = ["D212", "NPY201"]
lint.ignore = [
  # D105 Docstrings for magic methods
  "D105",
  # D107 Docstrings for __init__
  "D107",
  # D203 as it conflicts with D211 https://github.com/PyCQA/pydocstyle/issues/141
  "D203",
  # D205 1 blank line required between summary line and description, awkward spacing
  "D205",
  # D400 First line should end with a period, doesn't work when sentence spans 2 lines
  "D400",
]
lint.extend-ignore = ["E203"]
lint.per-file-ignores = { "__init__.py" = ["F401"] }
lint.pydocstyle = { convention = "pep257" }

[tool.bandit]
# skips asserts
# B101: https://bandit.readthedocs.io/en/latest/plugins/b101_assert_used.html#
# B104: https://bandit.readthedocs.io/en/latest/plugins/b104_hardcoded_bind_all_interfaces.html
# B104: https://bandit.readthedocs.io/en/latest/blacklists/blacklist_calls.html#b311-random
# B105: https://bandit.readthedocs.io/en/latest/plugins/b105_hardcoded_password_string.html
skips = ["B101", "B104", "B105", "B311"]
exclude_dirs = [
  # Data file only
  "apps/merino/merino/utils/domain_categories/domain_category_mapping.py",
  # Test utilities
  "apps/merino/tests/utils/test_probe.py",
]

[tool.mypy]
python_version = "3.14"
# To suppress the 'duplicate modules named "test"' warning
explicit_package_bases = true
plugins = ["pydantic.mypy"]
disallow_untyped_calls = true
follow_imports = "normal"
ignore_missing_imports = true
pretty = true
show_error_codes = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
warn_unreachable = true

[tool.pytest.ini_options]
markers = [
  "restore_load_manifest: disable the mock_load_manifest autouse fixture and use the real file",
]
testpaths = [
  "apps/merino/tests",
  "packages/merino-common/tests",
  "apps/fleece/tests",
]
pythonpath = ["apps/merino"]
norecursedirs = [
  "apps/merino/tests/data/",
  "apps/merino/tests/utils/",
  "tools/load-tests/",
]
addopts = [
  "-v",
  "-r s",
  "--cov=merino",
  "--import-mode=importlib",
]
filterwarnings = [
  # Transform warnings into errors.
  # Reference https://docs.pytest.org/en/stable/how-to/capture-warnings.html
  # to exempt from this transformation, which should be very rare for Merino.
  "error",
  # Ignored due to https://github.com/encode/starlette/discussions/2603
  "ignore::pytest.PytestUnraisableExceptionWarning",
  # Ignored while callers are being migrated to SyncedGcsBlobV2
  "ignore:Prefer SyncedGcsBlobV2:DeprecationWarning",
  # Ignored due to gcloud.aio.storage relies on backoff
  "ignore:'asyncio\\.iscoroutinefunction' is deprecated:DeprecationWarning",
  # Ignored: starlette.testclient nudges toward httpx2, but the suite uses httpx.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
  # Ignored: testcontainers' own RedisContainer uses the deprecated decorator internally.
  "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning",
]
