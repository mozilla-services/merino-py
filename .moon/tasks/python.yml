inheritedBy:
  language: python

# Every Python project shares the root tool configuration and uv lockfile.
# Upstream project inputs ensure, for example, that a common-library change
# invalidates tasks in Merino and Fleece as well.
implicitInputs:
  - pyproject.toml
  - /pyproject.toml
  - /uv.lock
  - /.python-version
  - project://^

taskOptions:
  runFromWorkspaceRoot: true

tasks:
  lint:
    description: Run Ruff lint checks for this project
    deps:
      - workspace:install
    command: uv
    args:
      - run
      - --frozen
      - --no-sync
      - ruff
      - check
    tags:
      - quality
      - ci

  format-check:
    description: Check Ruff formatting for this project
    deps:
      - workspace:install
    command: uv
    args:
      - run
      - --frozen
      - --no-sync
      - ruff
      - format
      - --check
    tags:
      - quality
      - ci

  security:
    description: Run Bandit security checks for this project
    deps:
      - workspace:install
    command: uv
    args:
      - run
      - --frozen
      - --no-sync
      - bandit
      - --quiet
      - --recursive
    tags:
      - quality
      - ci

  typecheck:
    description: Run mypy for this project
    deps:
      - workspace:install
    command: uv
    args:
      - run
      - --frozen
      - --no-sync
      - mypy
    env:
      # Parallel projects must not write to the same mypy cache database.
      MYPY_CACHE_DIR: .mypy_cache/$project
    tags:
      - quality
      - ci

  test:
    description: Run unit tests for this project
    deps:
      - workspace:install
    command: uv
    args:
      - run
      - --frozen
      - --no-sync
      - pytest
      - --config-file
      - pyproject.toml
      # Replace the root's Merino-only coverage source with the project's source.
      - --cov-reset
      - --cov-report=term:skip-covered
      - --cov-report=json:workspace/test-results/moon/$project/unit__coverage.json
      - --junitxml=workspace/test-results/moon/$project/unit__results.xml
      - -o
      - junit_suite_name=$project-unit
    env:
      MERINO_ENV: testing
      COVERAGE_FILE: workspace/test-results/moon/$project/.coverage.unit
    outputs:
      - /workspace/test-results/moon/$project/.coverage.unit
      - /workspace/test-results/moon/$project/unit__coverage.json
      - /workspace/test-results/moon/$project/unit__results.xml
    tags:
      - test
      - ci
