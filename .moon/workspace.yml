versionConstraint: ">=2.6.0 <2.7.0"

projects:
  workspace: .
  merino: apps/merino
  fleece: apps/fleece
  embroidery: apps/embroidery
  merino-common: packages/merino-common
  load-tests: tools/load-tests
  docs: docs

vcs:
  client: git
  defaultBranch: main

# uv remains responsible for installing and locking Python dependencies. Moon
# orchestrates uv commands but must not try to manage the environment itself.
# Rust is the exception: its install step only installs the Cargo tools in `rust.bins`
# (toolchains.yml).
pipeline:
  installDependencies:
    - rust
