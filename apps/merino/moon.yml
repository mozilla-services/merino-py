language: python
stack: backend
layer: application

project:
  title: Merino
  description: Firefox Suggest service and jobs

dependsOn:
  - id: merino-common
    scope: production

toolchains:
  default: system

tasks:
  docker-build:
    args:
      - --tag
      - app:build
      - .
    inputs:
      - /dev/**/*

  lint:
    args:
      - apps/merino/merino
      - apps/merino/tests

  format-check:
    args:
      - apps/merino/merino
      - apps/merino/tests

  security:
    args:
      - apps/merino/merino
      - apps/merino/tests
      - --configfile
      - pyproject.toml

  typecheck:
    args:
      - apps/merino/merino
      - apps/merino/tests
      - --config-file=pyproject.toml
    env:
      MYPYPATH: apps/merino:packages/merino-common

  unit-test:
    args:
      - apps/merino/tests/unit
      - --cov=merino
    inputs:
      - "**/*"
      - /dev/GeoLite2-City-Test.mmdb

  test:
    # Like the former `make test`, report combined coverage after both suites and enforce the gate.
    deps:
      - coverage

  build-test-image:
    description: Build the Elasticsearch image required by integration tests
    command:
      - docker
      - build
      - --tag
      - merino-elasticsearch:local
      - dev/local_setup/elasticsearch
    inputs:
      - /dev/local_setup/elasticsearch/**/*
    toolchains: system
    options:
      # The image lives in Docker, not in Moon's output cache.
      cache: false
      runFromWorkspaceRoot: true

  integration-test:
    args:
      - apps/merino/tests/integration
      - --cov=merino
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    inputs:
      - "**/*"
      # The Elasticsearch image's Dockerfile, and an optional override of the image to test against.
      - /dev/**/*
      - $ES_IMAGE
    deps:
      - build-test-image

  coverage:
    description: Combine Merino unit and integration coverage and enforce the existing 95% gate
    script: |
      set -eu
      uv run --frozen --no-sync coverage combine --keep \
        workspace/test-results/moon/merino/.coverage.unit \
        workspace/test-results/moon/merino/.coverage.integration
      uv run --frozen --no-sync coverage json \
        -o workspace/test-results/moon/merino/combined__coverage.json
      uv run --frozen --no-sync coverage xml \
        -o workspace/test-results/moon/merino/coverage.xml
      uv run --frozen --no-sync coverage report --fail-under=95
    env:
      COVERAGE_FILE: workspace/test-results/moon/merino/.coverage
    deps:
      - unit-test
      - integration-test
    outputs:
      - /workspace/test-results/moon/merino/.coverage
      - /workspace/test-results/moon/merino/combined__coverage.json
      - /workspace/test-results/moon/merino/coverage.xml
    tags:
      - coverage
    toolchains: system
    options:
      runFromWorkspaceRoot: true

  diff-coverage:
    description: Enforce 95% coverage on Merino lines changed against origin/main
    command:
      - uv
      - run
      - --frozen
      - --no-sync
      - diff-cover
      - workspace/test-results/moon/merino/coverage.xml
      - --compare-branch=origin/main
      - --fail-under=95
    deps:
      - coverage
    tags:
      - coverage
    toolchains: system
    options:
      # The comparison ref can move without changing project files.
      cache: false
      runFromWorkspaceRoot: true
