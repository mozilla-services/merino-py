
[project]
name = "merino"
version = "0.1.0"
description = "Service for Firefox Suggest at Mozilla"
authors = [{ name = "Mozilla" }]
requires-python = "~=3.14.0"
license = { text = "MPL-2.0" }
dependencies = [
    "fastapi[standard]>=0.135.0,<1",
    "dockerflow>=2026.3.4,<2027",
    "asgi-correlation-id>=4.3.4,<5",
    "dynaconf>=3.2.4,<4",
    "httpx>=0.28.0,<1",
    "sentry-sdk[fastapi]>=2.13.0,<3",
    "kinto-http>=11.9.0,<12",
    "aiodogstatsd>=0.16.0,<0.17",
    "geoip2>=5.2.0,<6",
    "rich>=15.0.0,<16",
    "wrapt>=1.14.1,<2",
    "elasticsearch[async]>=8.5.0,<9",
    "google-cloud-storage>=3.10.0,<4",
    "google-cloud-bigquery>=3.41.0,<4",
    "google-cloud-pubsub>=2.39.0,<3",
    "Pillow>=12.2.0,<13",
    "types-python-dateutil>=2.8.19.13,<3",
    "pydantic>=2.13.0,<3",
    "scipy>=1.17.0,<2",
    "orjson>=3.11.0,<4",
    "tenacity>=9.0.0,<10",
    "gcloud-aio-storage>=9.6.0,<10",
    "ua-parser>=1.0,<2.0",
    "redis[hiredis]>=7.4.0,<8",
    "circuitbreaker>=2.1.3",
    "mozilla-merino-ext>=0.3.3",
    "torch>=2.11.0",
    "safetensors>=0.7.0,<1",
    "wordsegment>=1.3.1,<2",
    "jsonschema>=4.26.0",
    # Internal dependencies
    "merino-common",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-exporter-otlp-proto-http>=1.42.1",
    # Merino job runner dependencies
    "typer>=0.24.0,<1",
    "tldextract>=3.4.4,<4",
    "mechanicalsoup>=1.3.0",
    "psutil>=7.0.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]
merino-common = { workspace = true }

[tool.uv.build-backend]
module-name = "merino"
# Opt for the flat structure "merino" over "src/merino".
module-root = ""

[project.scripts]
merino-jobs = "merino.jobs.cli:cli"
probe-images = "merino.jobs.utils.domain_tester:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12"]
build-backend = "uv_build"
