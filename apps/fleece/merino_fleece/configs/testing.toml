# Configurations for testing. Configurations defined here will override the
# counterparts in `default.toml`.

[testing]
dynaconf_merge = true

[testing.logging]
level = "DEBUG"
format = "pretty"
can_propagate = true

[testing.mars]
# Keep the AMP exempt off by default so the app lifespan never reaches out to MARS.
# Tests that exercise `AmpExempt` construct it directly.
enabled = false
base_url = "http://test-mars-api"
