language: python
stack: backend
layer: application

project:
  title: Fleece
  description: PII sanitization service supporting Merino

dependsOn:
  - id: merino-common
    scope: production

toolchains:
  default: system

workspace:
  inheritedTasks:
    # No integration suite yet. Remove this to add one under tests/integration.
    exclude:
      - integration-test

tasks:
  docker-build:
    args:
      - --tag
      - app-fleece:build
      - .

  lint:
    args:
      - apps/fleece/merino_fleece
      - apps/fleece/tests

  format-check:
    args:
      - apps/fleece/merino_fleece
      - apps/fleece/tests

  security:
    args:
      - apps/fleece/merino_fleece
      - apps/fleece/tests
      - --configfile
      - pyproject.toml

  typecheck:
    args:
      - apps/fleece/merino_fleece
      - apps/fleece/tests
      - --config-file=pyproject.toml
    env:
      MYPYPATH: apps/fleece:packages/merino-common

  unit-test:
    args:
      - apps/fleece/tests/unit
      - --cov=merino_fleece
    env:
      MERINO_FLEECE_ENV: testing
