language: python
stack: backend
layer: application

project:
  title: Hook-eye
  description: Additional monitoring for Merino, such as Elasticsearch cross-cluster replication health

dependsOn:
  - id: merino-common
    scope: production

toolchains:
  default: system

workspace:
  inheritedTasks:
    # No integration suite yet. Remove this to add one under tests/integration.
    exclude:
      - integration-test

tasks:
  docker-build:
    args:
      - --tag
      - app-hook-eye:build
      - .

  lint:
    args:
      - apps/hook-eye/merino_hook_eye
      - apps/hook-eye/tests

  format-check:
    args:
      - apps/hook-eye/merino_hook_eye
      - apps/hook-eye/tests

  security:
    args:
      - apps/hook-eye/merino_hook_eye
      - apps/hook-eye/tests
      - --configfile
      - pyproject.toml

  typecheck:
    args:
      - apps/hook-eye/merino_hook_eye
      - apps/hook-eye/tests
      - --config-file=pyproject.toml
    env:
      MYPYPATH: apps/hook-eye:packages/merino-common

  unit-test:
    args:
      - apps/hook-eye/tests/unit
      - --cov=merino_hook_eye
    env:
      MERINO_HOOK_EYE_ENV: testing
