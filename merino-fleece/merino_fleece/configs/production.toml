# Configurations for production. Configurations defined here will override the
# counterparts in `default.toml`.
#
# Switch to this environment via: MERINO_FLEECE_ENV=production

[production]
dynaconf_merge = true

[production.logging]
level = "INFO"
format = "mozlog"

[production.pubsub]
# MERINO_FLEECE_PUBSUB__SUBSCRIPTION
# Subscription for the backup PubSub topic.
subscription = "projects/moz-fx-merino-prod-5de4/subscriptions/merino-fleece-sanitization-prod"
