# Default configurations that may be overridden by the counterparts defined in:
# `development.toml`, `production.toml`, `testing.toml`, or environment variables.

[default]

[default.pii]
# MERINO_FLEECE_PII__MODEL
# SpaCy pre-trained NLP model used for NER detection.
# Allowed values: "en_core_web_sm", "en_core_web_md", "en_core_web_lg".
model = "en_core_web_sm"

# MERINO_FLEECE_PII__EXCLUDED_COMPONENTS
# SpaCy pipeline components to exclude at model load time. Only NER is needed.
excluded_components = ["tok2vec", "tagger", "parser", "attribute_ruler", "lemmatizer"]

# MERINO_FLEECE_PII__QUERY_CHARACTER_MAX
# Maximum allowed length of the `q` query parameter.
query_character_max = 500

# MERINO_FLEECE_PII__EXECUTOR_MAX_WORKERS
# Size of the thread pool that runs CPU-bound SpaCy NER off the event loop.
# Roughly match the number of CPU cores available to each worker process; a
# bounded pool avoids GIL thrashing under load.
executor_max_workers = 1

[default.sanitize]
# Queue settings for background search term sanitization. The queue tunables below
# mirror merino's `[default.message_handler]` so producer and consumer batch at the
# same cadence.

# MERINO_FLEECE_SANITIZE__MAX_BATCH_SIZE
# Max number of queued search terms to sanitize in a single batch.
max_batch_size = 512

# MERINO_FLEECE_SANITIZE__COLLECTION_DELAY_SEC
# Max seconds to wait for a batch to fill before sanitizing a partial batch.
collection_delay_sec = 5.0

# MERINO_FLEECE_SANITIZE__SHUTDOWN_DEADLINE_SEC
# Max seconds to spend draining the queue during graceful shutdown before any
# remaining search terms are dropped.
shutdown_deadline_sec = 30.0

# MERINO_FLEECE_SANITIZE__MAX_QUEUE_SIZE
# Max number of search terms to buffer in the queue. Submissions are rejected with
# a 503 once this capacity is reached.
max_queue_size = 10000

# MERINO_FLEECE_SANITIZE__NER_CHUNK_SIZE
# Number of queries handed to SpaCy's `nlp.pipe()` per thread pool hop. Larger
# values amortize the model's per-call overhead further; smaller values release the
# shared NER thread more often, so concurrent `/pii` requests are not stuck waiting
# behind a long batch. Unrelated to `max_batch_size`: a 512-term batch becomes at
# most 8 hops at the default.
ner_chunk_size = 64

# MERINO_FLEECE_SANITIZE__LOG_SEARCH_TERMS
# Whether to emit the `web.suggest.sanitized` data log for search terms that
# sanitization clears as NON_PII. Terms flagged as any other PII type are never
# logged. Off by default; enabled per environment once the log sink is in place.
log_search_terms = false

[default.mars]
# Settings for the MARS API, the source of the AMP search term sanitization exempt.
# Mirrors merino's `[default.mars]` so both services' MARS settings read the same.

# MERINO_FLEECE_MARS__ENABLED
# Whether the AMP sanitization exempt fetches keywords from MARS. When false, no
# `AmpExempt` is registered and every search term is sanitized normally.
enabled = true

# MERINO_FLEECE_MARS__BASE_URL
# The base URL for the MARS API.
base_url = "https://ads.mozilla.org/v1/suggest/"

# MERINO_FLEECE_MARS__SUGGESTION_URL_PATH
# The URL path for fetching suggestions from the MARS API.
suggestion_url_path = "data"

# MERINO_FLEECE_MARS__CONNECT_TIMEOUT_SEC
# Timeout in seconds for establishing a connection to the MARS API.
connect_timeout_sec = 5.0

# MERINO_FLEECE_MARS__REQUEST_TIMEOUT_SEC
# Timeout in seconds for a request to the MARS API.
request_timeout_sec = 10.0

# MERINO_FLEECE_MARS__COUNTRIES
# Countries to fetch AMP keywords for. The keywords of every `country x form_factor`
# segment are unioned into a single exempt set, so this scales the memory footprint.
countries = ["US"]

# MERINO_FLEECE_MARS__FORM_FACTORS
# Form factors to fetch AMP keywords for.
form_factors = ["desktop"]

# MERINO_FLEECE_MARS__RESYNC_INTERVAL_SEC
# Time between re-syncs of AMP keywords from MARS, in seconds. Defaults to 1 hour.
resync_interval_sec = 3600

# MERINO_FLEECE_MARS__CRON_INTERVAL_SEC
# The interval of the MARS resync cron job, in seconds. The cron job should tick more
# frequently than `resync_interval_sec` so that a resync failure can be retried soon.
cron_interval_sec = 60

[default.sentry]
# MERINO_FLEECE_SENTRY__MODE
# One of "disabled", "release", "debug". When "disabled", no Sentry client is initialized.
mode = "disabled"

# MERINO_FLEECE_SENTRY__DSN
# Sentry DSN. Provided via env var in stage/production. Ignored when mode = "disabled".
dsn = ""

# MERINO_FLEECE_SENTRY__ENV
# Sentry environment tag. One of "prod", "stage", "dev".
env = "dev"

# MERINO_FLEECE_SENTRY__TRACES_SAMPLE_RATE
# Fraction of transactions to capture for performance monitoring, in [0.0, 1.0].
traces_sample_rate = 0.0

[default.logging]
# MERINO_FLEECE_LOGGING__FORMAT
# Either "mozlog" or "pretty".
format = "mozlog"

# MERINO_FLEECE_LOGGING__LEVEL
# Any of "DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL".
level = "INFO"

# MERINO_FLEECE_LOGGING__CAN_PROPAGATE
# Whether the merino-fleece loggers should propagate to the root logger.
can_propagate = false

[default.pubsub]
# MERINO_FLEECE_PUBSUB__SUBSCRIPTION
# Subscription for the backup PubSub topic.
subscription = "projects/merino-local/subscriptions/merino-fleece-sanitization-local"

# MERINO_FLEECE_PUBSUB__RESTART_STREAM
# Whether to restart pubsub subscription on stream errors
restart_stream = true

# MERINO_FLEECE_PUBSUB__RESTART_BACKOFF
# How long to wait before restarting stream after stream error
# Only applicable if `restart_stream` is true
restart_backoff = 10  # seconds

# MERINO_FLEECE_PUBSUB__HEARTBEAT_PATH
# Filesystem path the worker refreshes while the streaming pull is running, for an
# external liveness probe (e.g. a Kubernetes exec probe). Parent directories are created
# on demand. Must be writable by the container's unprivileged `app` user (uid 10001)
# Empty disables the heartbeat.
heartbeat_path = ""

# MERINO_FLEECE_PUBSUB__HEARTBEAT_INTERVAL
# How often to refresh the heartbeat file. Keep the probe's staleness threshold
# comfortably above `heartbeat_interval + restart_backoff`.
heartbeat_interval = 10  # seconds

# MERINO_FLEECE_PUBSUB__SANITIZE_TIMEOUT_SEC
# Max seconds a message callback waits for its search terms to be sanitized before
# nacking the message for redelivery. Keep comfortably under the subscription's max ack
# deadline, since a blocked callback holds the message's lease.
sanitize_timeout_sec = 30.0

# MERINO_FLEECE_PUBSUB__MAX_MESSAGES
# Pub/Sub flow-control cap on messages leased concurrently. The streaming pull dispatches
# callbacks on its own thread pool, but they all funnel into the single NER thread pool
# sized by `pii.executor_max_workers`, so leasing far more than that pool can chew through
# just queues work until callbacks hit `sanitize_timeout_sec`. Keep it near the pool size.
max_messages = 4
