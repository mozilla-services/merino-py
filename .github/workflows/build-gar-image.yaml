name: build-gar-image

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-project-image
        with:
          project: merino
          image: app:build
          artifact-name: merino
