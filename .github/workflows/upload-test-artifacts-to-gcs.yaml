name: upload-test-artifacts-to-gcs

on:
  workflow_call:
    inputs:
      service_account:
        description: "Service account to use for authentication"
        required: false
        type: string
        default: "merinopy-github@ecosystem-test-eng.iam.gserviceaccount.com"
      source:
        description: "Source directory containing test artifacts"
        required: false
        type: string
        default: "workspace/test-results"
      destination:
        description: "GCS bucket destination for uploaded artifacts"
        required: true
        type: string
      extension:
        description: "File extension filter for artifacts"
        required: false
        type: string

jobs:
  upload-to-gcs:
    runs-on: ubuntu-24.04
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Set up Google Cloud Authentication
        uses: google-github-actions/auth@v3
        with:
          service_account: ${{ inputs.service_account }}
          workload_identity_provider: ${{ vars.GCPV2_GITHUB_WORKLOAD_IDENTITY_PROVIDER }}
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
      # moon-ci uploads `unit-test-results` and `integration-test-results` only when the matching
      # suites ran. A pattern download succeeds with zero matches, unlike a download by name.
      - name: Download Test Artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: "*-test-results"
          path: ${{ inputs.source }}
          merge-multiple: true
      - name: Upload Artifacts to GCS
        run: |
          shopt -s nullglob
          files=("${{ inputs.source }}"/*)
          if [ -n "${{ inputs.extension }}" ]; then
            files=("${{ inputs.source }}"/*."${{ inputs.extension }}")
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            # Some changes produce no reports of the requested type.
            echo "::notice::No ${{ inputs.extension }} files found in ${{ inputs.source }}/, skipping upload"
            exit 0
          fi
          gcloud storage cp "${files[@]}" "${{ inputs.destination }}/"
