name: moon-ci

on:
  workflow_call:
    inputs:
      build-images:
        description: Include image builds in the Moon graph
        type: boolean
        default: true
    outputs:
      merino:
        description: Whether a Merino image was built and uploaded
        value: ${{ jobs.ci.outputs.merino }}
      fleece:
        description: Whether a Fleece image was built and uploaded
        value: ${{ jobs.ci.outputs.fleece }}
      embroidery:
        description: Whether an Embroidery image was built and uploaded
        value: ${{ jobs.ci.outputs.embroidery }}
      hook_eye:
        description: Whether a Hook-Eye image was built and uploaded
        value: ${{ jobs.ci.outputs.hook_eye }}
      load_tests:
        description: Whether a Locust image was built and uploaded
        value: ${{ jobs.ci.outputs.load_tests }}
      docs:
        description: Whether documentation was built and uploaded
        value: ${{ jobs.ci.outputs.docs }}

permissions:
  contents: read

jobs:
  ci:
    # Pinned in every workflow so the Ubuntu 26 image move is deliberate (weave's apt packages);
    # bump all of them together once CI passes on the new image.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      merino: ${{ steps.images.outputs.merino }}
      fleece: ${{ steps.images.outputs.fleece }}
      embroidery: ${{ steps.images.outputs.embroidery }}
      hook_eye: ${{ steps.images.outputs.hook_eye }}
      load_tests: ${{ steps.images.outputs.load_tests }}
      docs: ${{ steps.docs.outputs.built }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/weave
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-moon
      - uses: ./.github/actions/setup-rust
      - name: Set up documentation tools
        run: |
          mkdir -p bin
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
          curl -fsSL \
            https://github.com/rust-lang/mdBook/releases/download/v0.4.24/mdbook-v0.4.24-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz --directory=bin
          curl -fsSL \
            https://github.com/badboy/mdbook-mermaid/releases/download/v0.12.6/mdbook-mermaid-v0.12.6-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz --directory=bin
      - name: Prepare build metadata
        run: |
          mdbook-mermaid install ./
          bash .github/scripts/write-version.sh
      - name: Run affected Moon tasks
        id: moon
        env:
          MOON_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
          MOON_HEAD: ${{ github.sha }}
          MOON_FORCE: ${{ github.event_name == 'workflow_dispatch' || github.event.forced == true }}
          BUILD_IMAGES: ${{ inputs.build-images }}
          # Rust warnings, including Clippy's, fail CI. Local task runs keep them as warnings so
          # work in progress still compiles.
          RUSTFLAGS: "-D warnings"
        # A single graph runs independent tasks concurrently and runs shared dependencies once.
        run: |
          targets=(':#quality' :test merino:diff-coverage load-tests:validate docs:build)
          if [[ "$BUILD_IMAGES" == true ]]; then
            targets+=(:docker-build)
          fi
          moon ci "${targets[@]}" --downstream none
      - name: Summarize Moon tasks
        if: ${{ !cancelled() && steps.moon.outcome != 'skipped' }}
        env:
          MOON_OUTCOME: ${{ steps.moon.outcome }}
        run: |
          report=.moon/cache/ciReport.json
          if [[ ! -f "$report" ]]; then
            message='Moon exited before writing a task report. See the Moon step log.'
            if [[ "$MOON_OUTCOME" == success ]]; then
              message='No affected Moon tasks ran.'
            fi
            printf '### Moon tasks\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          jq -er '
            [.actions[] | select(.node.action == "run-task")]
            | sort_by(.node.params.target)
            | "### Moon tasks", "",
              (if length == 0 then "No Moon tasks ran."
               else "| Task | Status | Duration |", "| --- | --- | ---: |",
                 (.[] | (.duration | if . == null then "n/a"
                         else "\((.secs * 1000 + .nanos / 1e6 | round) / 1000) s" end) as $time
                   | "| `\(.node.params.target)` | \(.status) | \($time) |")
               end)
          ' "$report" >> "$GITHUB_STEP_SUMMARY"
      - name: Package images for the existing publishers
        id: images
        # The PR image job only validates builds, so it skips the save and upload.
        if: inputs.build-images && github.event_name != 'pull_request'
        shell: bash
        run: |
          for entry in 'merino app:build merino' 'fleece app-fleece:build merino-fleece' \
            'embroidery app-embroidery:build merino-embroidery' \
            'hook_eye app-hook-eye:build merino-hook-eye' \
            'load_tests merino-locust:build locust-image'; do
            read -r project image artifact <<< "$entry"
            if docker image inspect "$image" > /dev/null 2>&1; then
              mkdir -p "workspace/images/$artifact"
              # The ubuntu-24.04 runner includes pigz for parallel gzip compression.
              docker save "$image" | pigz > "workspace/images/$artifact/image.tar.gz"
              echo "$project=true" >> "$GITHUB_OUTPUT"
            fi
          done
      # The image archives are already gzip-compressed for the publisher jobs.
      - uses: actions/upload-artifact@v6
        if: steps.images.outputs.merino == 'true'
        with:
          name: merino
          path: workspace/images/merino/image.tar.gz
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: steps.images.outputs.fleece == 'true'
        with:
          name: merino-fleece
          path: workspace/images/merino-fleece/image.tar.gz
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: steps.images.outputs.embroidery == 'true'
        with:
          name: merino-embroidery
          path: workspace/images/merino-embroidery/image.tar.gz
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: steps.images.outputs.hook_eye == 'true'
        with:
          name: merino-hook-eye
          path: workspace/images/merino-hook-eye/image.tar.gz
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: steps.images.outputs.load_tests == 'true'
        with:
          name: locust-image
          path: workspace/images/locust-image/image.tar.gz
          compression-level: 0
          if-no-files-found: error
      - name: Check for built documentation
        id: docs
        run: |
          if [ -d book ]; then
            echo 'built=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.docs.outputs.built == 'true'
        with:
          path: book
      - name: Package reports for the existing metrics uploader
        if: always()
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          prefix="${GITHUB_RUN_NUMBER}__$(date +%s)__${REPOSITORY_NAME}__${GITHUB_WORKFLOW}__"
          mkdir -p workspace/unit-test-results workspace/integration-test-results
          for project in merino merino-common fleece hook-eye embroidery; do
            for suite in unit integration; do
              name="$suite"
              if [ "$project" != merino ]; then name="$project-$suite"; fi
              for report in results.xml coverage.json; do
                source="workspace/test-results/moon/$project/${suite}__$report"
                if [ -f "$source" ]; then
                  cp "$source" "workspace/$suite-test-results/${prefix}${name}__$report"
                fi
              done
            done
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: unit-test-results
          path: workspace/unit-test-results/
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: integration-test-results
          path: workspace/integration-test-results/
      - name: Upload Moon execution and coverage reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: moon-reports
          include-hidden-files: true
          path: |
            workspace/test-results/moon/
            .moon/cache/ciReport.json
            .moon/cache/runReport.json
