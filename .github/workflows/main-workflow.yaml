name: main-workflow # The ETE Pipeline integration depends on this name

on:
  push:
    branches:
      - main
  # Rebuild all images to recover a failed release or refresh external dependencies.
  workflow_dispatch:

jobs:
  detect-images:
    uses: ./.github/workflows/detect-image-changes.yaml
  run-checks:
    uses: ./.github/workflows/checks.yaml
  run-tests:
    uses: ./.github/workflows/tests.yaml
  upload-test-artifacts:
    needs: run-tests
    if: always() # Ensure the job runs even if previous jobs, like test runs, fail
    uses: ./.github/workflows/upload-test-artifacts-to-gcs.yaml
    with:
      destination: "gs://ecosystem-test-eng-metrics/merino-py/junit"
      extension: "xml"
  upload-coverage-artifacts:
    needs: run-tests
    if: always() # Ensure the job runs even if previous jobs, like test runs, fail
    uses: ./.github/workflows/upload-test-artifacts-to-gcs.yaml
    with:
      destination: "gs://ecosystem-test-eng-metrics/merino-py/coverage"
      extension: "json"
  run-docs-build:
    uses: ./.github/workflows/docs-build.yaml
  run-docs-publish-github-pages:
    needs: run-docs-build
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/docs-publish-github-pages.yaml
  run-build-gar-image:
    needs: detect-images
    if: needs.detect-images.outputs.merino == 'true'
    uses: ./.github/workflows/build-gar-image.yaml
  run-publish-gar-image:
    needs: [run-checks, run-tests, run-build-gar-image]
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/publish-gar-image.yaml
    with:
      image_tag: latest
      project_id: ${{ vars.GCP_PROJECT_ID }}
      workload_identity_pool_project_number: ${{ vars.GCPV2_WORKLOAD_IDENTITY_POOL_PROJECT_NUMBER }}
    secrets:
      DOCKER_IMAGE_PATH: ${{ secrets.DOCKER_IMAGE_PATH }}
  run-build-gar-image-fleece:
    needs: detect-images
    if: needs.detect-images.outputs.fleece == 'true'
    uses: ./.github/workflows/build-gar-image-fleece.yaml
  run-publish-gar-image-fleece:
    needs: [run-checks, run-tests, run-build-gar-image-fleece]
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/publish-gar-image-fleece.yaml
    with:
      image_tag: latest
      project_id: ${{ vars.GCP_PROJECT_ID }}
      workload_identity_pool_project_number: ${{ vars.GCPV2_WORKLOAD_IDENTITY_POOL_PROJECT_NUMBER }}
    secrets:
      DOCKER_IMAGE_PATH: ${{ secrets.DOCKER_IMAGE_PATH }}
  run-build-gar-image-locust:
    needs: detect-images
    if: needs.detect-images.outputs.load_tests == 'true'
    uses: ./.github/workflows/build-gar-image-locust.yaml
  run-publish-gar-image-locust:
    needs: [run-checks, run-tests, run-build-gar-image-locust]
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/publish-gar-image-locust.yaml
    with:
      image_tag: latest
      project_id: ${{ vars.GCP_PROJECT_ID }}
      workload_identity_pool_project_number: ${{ vars.GCPV2_WORKLOAD_IDENTITY_POOL_PROJECT_NUMBER }}
    secrets:
      DOCKER_IMAGE_PATH: ${{ secrets.DOCKER_IMAGE_PATH }}
  run-publish-dockerhub-app:
    needs: [run-checks, run-tests, run-build-gar-image]
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/publish-dockerhub-app-image.yaml
    with:
      image_tag: ${{ github.sha }}
    secrets:
      DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_REPO }}
      DOCKER_USER: ${{ secrets.DOCKER_USER }}
      DOCKERHUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
